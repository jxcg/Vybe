[project]
name = "vybe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "mistralai>=3.8.0",
    "mistralai-agents>=1.1.3",
    "mistralai-workflows>=3.20.0",
    "uvicorn>=0.30",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[project.scripts]
app = "app.main:app"

[tool.vercel.scripts]
build = "npm ci --prefix web && npm run build --prefix web"
